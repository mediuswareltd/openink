  # ------------------------------------------------------------------ colours
  - id: colours
    title: Colours
    blocks:
      - { type: h1, text: Colour a whole project or just one part }
      - { type: text, muted: true, text: "Project: theme: color | pastel | blueprint | dark, or colors: { accent: '#e11d48' }.  Part: tone: blue on any block." }
      - type: grid
        cols: 3
        children:
          - { type: card, tone: blue, title: blue, children: [{ type: text, text: Outlines and text take the colour. }, { type: button, label: Action, primary: true }] }
          - { type: card, tone: green, title: green, children: [{ type: text, text: Great for success states. }, { type: chart, kind: bar, h: 90 }] }
          - { type: card, tone: yellow, title: yellow, children: [{ type: text, text: Highlights and warnings. }, { type: rating, value: 4 }] }
          - { type: card, tone: red, title: red, children: [{ type: text, text: Errors and danger zones. }, { type: button, label: Delete, icon: trash }] }
          - { type: card, tone: purple, title: purple, children: [{ type: text, text: Premium features. }, { type: progress, value: 40 }] }
          - { type: card, tone: pink, title: pink, children: [{ type: text, text: Friendly and playful. }, { type: icon, name: heart, filled: true, size: 28 }] }
          - { type: card, tone: orange, title: orange, children: [{ type: text, text: Calls to action. }, { type: badge, status: wait, text: New }] }
          - { type: card, tone: teal, title: teal, children: [{ type: text, text: Calm and trustworthy. }, { type: toggle, label: Enabled, checked: true }] }
          - { type: card, tone: gray, title: gray, children: [{ type: text, text: De-emphasised content. }, { type: image, h: 60, label: Image }] }
      - { type: h3, text: "fill: true tints the background" }
      - { type: alert, kind: info, text: "You can mix tone and fill on any block, and even on a whole screen." }
      - type: row
        children:
          - { type: text, tone: blue, fill: true, text: Blue fill }
          - { type: text, tone: green, fill: true, text: Green fill }
          - { type: text, tone: pink, fill: true, text: Pink fill }
          - { type: text, fill: true, text: Neutral fill }
