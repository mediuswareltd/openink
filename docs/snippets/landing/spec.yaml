name: Lumen
theme: dark                     # one line restyles everything
screens:
  - id: home
    blocks:
      - type: hero
        title: Group trips, minus the group chat
        text: Plan together, vote on ideas, split every bill.
        align: left
        tone: purple
        fill: true
        children:
          - { type: button, label: Start free, open: join }
      - type: grid
        cols: 3
        children:
          - { type: card, title: Plan, tone: blue, fill: true }
          - { type: card, title: Vote, tone: pink, fill: true }
          - { type: card, title: Split, tone: green, fill: true }
modals:
  - id: join
    title: Join Lumen
    children:
      - { type: input, label: Email, placeholder: you@mail.com }
      - { type: button, label: Join, primary: true, close: true }
