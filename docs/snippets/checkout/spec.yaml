name: Checkout
theme: blueprint
screens:
  - id: pay
    width: narrow
    blocks:
      - { type: steps, items: [Bag, Delivery, Pay], active: 2 }
      - { type: input, label: Card number, placeholder: 4242 … }
      - type: row
        children:
          - { type: input, label: Expiry, placeholder: MM/YY }
          - { type: input, label: CVC, placeholder: "123" }
      - { type: toggle, label: Save this card, checked: true }
      - { type: button, label: Pay, primary: true, open: done }
modals:
  - id: done
    title: Order placed!
    children:
      - { type: alert, kind: success, text: It ships tomorrow. }
