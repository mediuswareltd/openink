name: Wanderly
screens:
  - id: explore
    blocks:
      - type: device                # a phone frame
        children:
          - { type: search, placeholder: Where to next? }
          - { type: chips, options: [All, Beach, Mountains] }
          - type: card
            toast: Booked for 3 nights!   # tap the card
            children:
              - { type: carousel, h: 120, label: Lisbon loft }
              - { type: h3, text: "Alfama loft, Lisbon" }
              - { type: rating, value: 5, text: $120 / night }
          - type: tabbar
            items: [{ icon: home }, { icon: pin }, { icon: user }]
