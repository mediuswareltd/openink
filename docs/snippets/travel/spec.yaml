name: Wanderly
theme: pastel
screens:
  - id: explore
    blocks:
      - type: device                # a phone frame
        tone: purple                # colours all inside it
        children:
          - { type: search, placeholder: Where to next? }
          - { type: chips, options: [All, Beach, Mountains] }
          - type: card
            tone: pink
            fill: true
            toast: Booked for 3 nights!
            children:
              - { type: carousel, h: 120, label: Lisbon loft }
              - { type: h3, text: "Alfama loft · $120" }
              - { type: rating, value: 5, tone: orange }
          - type: tabbar
            items: [{ icon: home }, { icon: pin }, { icon: user }]
