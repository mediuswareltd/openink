name: Pulse
theme: color                    # one line restyles everything
screens:
  - id: home
    blocks:
      - type: grid
        cols: 3
        children:
          - { type: stat, label: Sales, value: $48k, delta: +12% }
          - { type: stat, label: Users, value: 1.2k, delta: +8% }
          - { type: stat, label: NPS, value: "62", delta: +4 }
      - { type: chart, kind: area, h: 160, label: Sales }
      - type: grid
        children:
          - { type: chart, kind: bar, h: 130, label: Sign-ups }
          - { type: chart, kind: donut, h: 130, label: Plans }
