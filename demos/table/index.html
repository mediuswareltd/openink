<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orders · wireframe</title>
<link rel="stylesheet" href="openink.css" />
<link rel="stylesheet" href="theme-color.css" />


<script>window.OPENINK={"languages":[],"first":"orders"};</script>
<script src="openink.js" defer></script>

</head>
<body>
<div class="shell">
<header class="oi-bar">
<a class="brand" data-go="orders">Orders</a>
<nav data-nav="default" hidden></nav>

<wired-button class="print-btn" onclick="window.print()">PDF</wired-button>
</header>
<main>
<section class="screen" id="orders" data-title="orders" data-nav="default">
<p class="screen-title">orders</p>

<wired-search-input placeholder="Search orders"></wired-search-input>
<table class="oi-table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th></tr></thead><tbody><tr><td>#1042</td><td>Ana</td><td><span class="badge on">Paid</span></td></tr><tr><td>#1041</td><td>Marc</td><td><span class="badge wait">Pending</span></td></tr><tr><td>#1040</td><td>Lea</td><td><span class="badge off">Refunded</span></td></tr></tbody></table>
<div class="row pagination"><wired-button data-toast="Previous page"><oi-icon name="arrow-left" size="18"></oi-icon></wired-button><div class="row" data-chips><wired-button class="chip on" elevation="3">1</wired-button><wired-button class="chip" elevation="1">2</wired-button><wired-button class="chip" elevation="1">3</wired-button><wired-button class="chip" elevation="1">4</wired-button><wired-button class="chip" elevation="1">5</wired-button></div><wired-button data-toast="Next page"><oi-icon name="arrow-right" size="18"></oi-icon></wired-button></div>
</section>
</main>

<footer class="muted center">Wireframe · not the final design</footer>
</div>
<div class="toast" id="toast"></div>
</body>
</html>
