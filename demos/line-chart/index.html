<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Traffic · wireframe</title>
<link rel="stylesheet" href="openink.css" />
<link rel="stylesheet" href="theme-color.css" />


<script>window.OPENINK={"languages":[],"first":"traffic"};</script>
<script src="openink.js" defer></script>

</head>
<body>
<div class="shell">
<header class="oi-bar">
<a class="brand" data-go="traffic">Traffic</a>
<nav data-nav="default" hidden></nav>

<wired-button class="print-btn" onclick="window.print()">PDF</wired-button>
</header>
<main>
<section class="screen" id="traffic" data-title="traffic" data-nav="default">
<p class="screen-title">traffic</p>

<h2>Visitors this week</h2>
<div class="tone" data-tone="teal"><oi-chart kind="line" h="220" values="120,180,150,240,210,320,290"></oi-chart></div>
</section>
</main>

<footer class="muted center">Wireframe · not the final design</footer>
</div>
<div class="toast" id="toast"></div>
</body>
</html>
